name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        netbeans: ['22', '30']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Build with Maven
      run: mvn -B -Dnetbeans.target=${{ matrix.netbeans }} clean verify

    - uses: actions/upload-artifact@v4
      with:
        name: NB-SpringBoot-NetBeans-${{ matrix.netbeans }}
        path: target/nbm/*.nbm
